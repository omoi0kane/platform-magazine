$schema: https://json-schema.org/draft/2020-12/schema
$title: Platform Book Manifest
type: object
additionalProperties: false
required: [id, title, author, source, output, rights]
properties:
  id: {type: string, pattern: '^[a-z0-9]+([._-][a-z0-9]+)+$'}
  title: {type: string, minLength: 1}
  author: {type: string, minLength: 1}
  source:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: {type: string, minLength: 1}
      type: {enum: [auto, pdf, images]}
      cover: {type: string, minLength: 1}
      back_cover: {type: boolean}
      page_order: {enum: [natural, affinity_spreads, affinity_spread_pages, explicit]}
      pages:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
    allOf:
      - if:
          required: [type]
          properties: {type: {const: images}}
        then:
          required: [cover]
  output:
    type: object
    additionalProperties: false
    required: [directory, version, latest_version]
    properties:
      directory: {type: string, minLength: 1}
      version: {type: string, pattern: '^\d+\.\d+\.\d+$'}
      latest_version: {type: string, pattern: '^\d+\.\d+\.\d+$'}
      latest_id: {type: string}
      target_name: {type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'}
      max_dimension: {type: integer, minimum: 64}
      jpeg_quality: {type: integer, minimum: 1, maximum: 100}
      warning_size_mb: {type: number, minimum: 0}
      hard_size_mb: {type: number, minimum: 0}

  rights:
    type: object
    additionalProperties: false
    required: [redistribution_approved, statement]
    properties:
      redistribution_approved: {const: true}
      statement: {type: string, minLength: 1}
