name: Build VPM listing

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LIST_PUBLISH_DIRECTORY: Website
  CI_PATH: ci

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout VPM listing builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.CI_PATH }}
          clean: false
          persist-credentials: false

      - name: Restore listing-builder cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CI_PATH }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-vpm-listing-${{ hashFiles('ci/**/global.json', 'ci/**/*.csproj') }}

      - name: Build package listing
        run: >-
          ${{ env.CI_PATH }}/build.cmd BuildRepoListing
          --root ${{ env.CI_PATH }}
          --list-publish-directory $GITHUB_WORKSPACE/${{ env.LIST_PUBLISH_DIRECTORY }}
          --current-package-name net.omoi0kane.platform-magazine.latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove obsolete test package from listing
        run: |
          PYTHONPATH=src python3 scripts/filter_vpm_listing.py \
            "${LIST_PUBLISH_DIRECTORY}/index.json" \
            --exclude net.omoi0kane.platform-magazine \
            --public-description 'VRChatワールドに設置して読めるPlatformの冊子です。'

      - name: Build grouped public listings
        run: |
          PYTHONPATH=src python3 scripts/build_group_listings.py \
            "${LIST_PUBLISH_DIRECTORY}/index.json" \
            "${LIST_PUBLISH_DIRECTORY}/listings" \
            --base-url https://omoi0kane.github.io/platform-magazine

      - name: Validate generated site
        run: |
          test -s "${LIST_PUBLISH_DIRECTORY}/index.json"
          test -s "${LIST_PUBLISH_DIRECTORY}/index.html"
          python3 -m json.tool "${LIST_PUBLISH_DIRECTORY}/index.json" >/dev/null
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from platform_book.listing import LISTING_GROUPS, group_slug_for_package

          packages = json.loads(Path("Website/index.json").read_text())["packages"]
          expected = {
              "net.omoi0kane.platform-magazine.latest",
              *(f"net.omoi0kane.platform-magazine.vol{number:02d}" for number in range(1, 10)),
              *(f"net.omoi0kane.platform-magazine.vol{number}" for number in range(10, 18)),
              *(f"net.omoi0kane.platform-magazine.special{year}" for year in range(2023, 2026)),
          }
          assert "net.omoi0kane.platform-magazine" not in packages
          assert expected <= packages.keys(), expected - packages.keys()
          assert all(
              manifest["description"] == "VRChatワールドに設置して読めるPlatformの冊子です。"
              for package in packages.values()
              for manifest in package["versions"].values()
          )

          groups = {group.slug: set() for group in LISTING_GROUPS}
          for package_id in packages:
              groups[group_slug_for_package(package_id)].add(package_id)
          grouped_packages = []
          listing_ids = set()
          for slug, expected_packages in groups.items():
              grouped = json.loads(Path(f"Website/listings/{slug}.json").read_text())
              assert set(grouped["packages"]) == expected_packages
              assert grouped["url"] == f"https://omoi0kane.github.io/platform-magazine/listings/{slug}.json"
              grouped_packages.extend(grouped["packages"])
              listing_ids.add(grouped["id"])
          assert len(listing_ids) == 6
          assert len(grouped_packages) == len(set(grouped_packages)) == len(packages)
          assert set(grouped_packages) == set(packages)
          PY
          ! grep -Fq 'net.omoi0kane.platform-magazine-0.0.8' "${LIST_PUBLISH_DIRECTORY}/index.json"
          ! grep -Fq 'data-package-id="net.omoi0kane.platform-magazine"' \
            "${LIST_PUBLISH_DIRECTORY}/index.html"
          ! grep -Fq '"net.omoi0kane.platform-magazine": {' \
            "${LIST_PUBLISH_DIRECTORY}/app.js"
          grep -Fq 'vcc://vpm/addRepo' "${LIST_PUBLISH_DIRECTORY}/app.js"
          grep -Fq '@fluentui/web-components@2.6.1' "${LIST_PUBLISH_DIRECTORY}/app.js"
          grep -Fq '@fluentui/web-components@2.6.1' "${LIST_PUBLISH_DIRECTORY}/index.html"
          grep -Fq 'https://omoi0kane.github.io/platform-magazine/index.json' \
            "${LIST_PUBLISH_DIRECTORY}/index.html"
          for slug in latest vol01-05 vol06-10 vol11-15 vol16-20 special; do
            test -s "${LIST_PUBLISH_DIRECTORY}/listings/${slug}.json"
            grep -Fq "listings/${slug}.json" "${LIST_PUBLISH_DIRECTORY}/index.html"
            grep -Fq "listings/${slug}.json" "${LIST_PUBLISH_DIRECTORY}/app.js"
          done

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.LIST_PUBLISH_DIRECTORY }}

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
