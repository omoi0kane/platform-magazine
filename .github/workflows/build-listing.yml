name: Build VPM listing

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LIST_PUBLISH_DIRECTORY: Website
  CI_PATH: ci

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout VPM listing builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.CI_PATH }}
          clean: false
          persist-credentials: false

      - name: Restore listing-builder cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CI_PATH }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-vpm-listing-${{ hashFiles('ci/**/global.json', 'ci/**/*.csproj') }}

      - name: Build package listing
        run: >-
          ${{ env.CI_PATH }}/build.cmd BuildRepoListing
          --root ${{ env.CI_PATH }}
          --list-publish-directory $GITHUB_WORKSPACE/${{ env.LIST_PUBLISH_DIRECTORY }}
          --current-package-name net.omoi0kane.platform-magazine.latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated site
        run: |
          test -s "${LIST_PUBLISH_DIRECTORY}/index.json"
          test -s "${LIST_PUBLISH_DIRECTORY}/index.html"
          python3 -m json.tool "${LIST_PUBLISH_DIRECTORY}/index.json" >/dev/null
          grep -Fq 'vcc://vpm/addRepo' "${LIST_PUBLISH_DIRECTORY}/app.js"
          grep -Fq 'https://omoi0kane.github.io/platform-magazine/index.json' \
            "${LIST_PUBLISH_DIRECTORY}/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.LIST_PUBLISH_DIRECTORY }}

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
